# Release-only pipeline. Nothing here builds a debug artefact: the unit tests
# run against the RELEASE variant and the build assembles exactly two things,
# the release APK for sideloading and testing, and the Android App Bundle for
# Google Play.
#
# SIGNING. Configure four repository secrets and the artefacts come out signed
# and uploadable:
#
#   ANDROID_KEYSTORE_BASE64     base64 of your release keystore
#                               (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without them the build still succeeds and still produces both artefacts,
# unsigned — useful on a fork or a pull request, useless for Play, and the
# summary step says which of the two you got rather than leaving it to be
# discovered at upload time.

name: Android release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.x requires Gradle 9; the two move together.
          #
          # Pinned to the version the 'current' run actually resolved and
          # built with, rather than to a guess. 'current' was a one-build
          # measure to learn this number: an unpinned toolchain lets a Gradle
          # release break the build on a day nothing was changed.
          gradle-version: '9.7.0'

      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # Against the release variant, so the debug variant is never assembled.
      # Unit tests are not minified — R8 applies to the packaged artefact, not
      # to the JVM test classpath — so this tests the same code the release
      # ships without needing a debug build to do it.
      # Cheap semantic checks first: they need no toolchain and they name the
      # file and line, where the same mistakes reach the compiler as errors
      # reported somewhere else entirely.
      # The translation corpus is generated from the layouts and the Kotlin
      # literals, so a string added without regenerating it would simply never
      # be translated. Regenerating here keeps the two in step; the checker
      # runs after, on the same tree.
      - name: Collect UI strings for translation
        run: python3 tools/collect_ui_strings.py

      - name: Static checks
        run: python3 tools/kotlin_checks.py

      # What unit-test tasks does this toolchain actually create? Printed
      # before they run, and never allowed to fail the build.
      #
      # AGP 9 did not create testReleaseUnitTest, and neither the release
      # notes nor the migration guide say what replaced it. Rather than guess
      # a task name — twice already this upgrade a guess has cost a full CI
      # run — this asks Gradle and puts the answer in the log, where the next
      # person to touch this file can read it instead of rediscovering it.
      - name: List the test tasks this toolchain provides
        continue-on-error: true
        run: gradle :app:tasks --all --no-daemon | grep -i "test" || true

      # `test` rather than a variant-specific task. It is Gradle's own
      # lifecycle task, AGP wires every unit-test task into it, and it is
      # therefore the one name that does not change between AGP majors.
      #
      # The cost is that if this toolchain creates unit tests for more than
      # one build type, all of them run. That is slower than the previous
      # release-only run and it is the right trade for a build that survives
      # the next upgrade. Once the log above says what exists, this can be
      # pinned back to a single variant.
      - name: Unit tests
        run: gradle :app:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # ANDROID_KEYSTORE_PATH is set only when the keystore was decoded. The
      # build script treats a blank or missing path as "no keystore", so
      # setting it unconditionally would still work — but not setting it keeps
      # the intent visible in the log.
      - name: Build release APK and Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bas-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Play bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: bas-play-bundle-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # R8 rewrites the release build, so a crash report from it is
      # unreadable without this file. Play accepts it directly, and keeping a
      # copy per build means an old release stays diagnosable after the next
      # one has overwritten what Play holds.
      - name: R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: bas-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## BAS release build"
            echo ""
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "**Signed** with the configured release keystore. The bundle can be uploaded to Play."
            else
              echo "**UNSIGNED** — no \`ANDROID_KEYSTORE_BASE64\` secret is configured."
              echo "The APK will not install without signing and Play will reject the bundle."
            fi
            echo ""
            echo "| Artefact | Path |"
            echo "|---|---|"
            for f in app/build/outputs/apk/release/*.apk; do
              [ -e "$f" ] && echo "| APK | \`$f\` ($(du -h "$f" | cut -f1)) |"
            done
            for f in app/build/outputs/bundle/release/*.aab; do
              [ -e "$f" ] && echo "| Play bundle | \`$f\` ($(du -h "$f" | cut -f1)) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
